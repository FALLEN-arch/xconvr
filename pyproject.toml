[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xconvr"
version = "0.1.0"
description = "A tiny universal file converter that routes to ffmpeg, ImageMagick, 7-Zip, and LibreOffice."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["convert", "ffmpeg", "imagemagick", "cli", "file-converter"]

[project.scripts]
xconvr = "xconvr:main"

[tool.setuptools]
py-modules = ["xconvr"]
